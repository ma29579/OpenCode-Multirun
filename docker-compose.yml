# Knowledge servers of the pilot study: two docs-mcp-servers provide the guidelines to the agent
# through MCP (scenarios "d-mcp-server" and "e-mcp-and-specs"). Its embeddings are computed by the local Ollama of the host.
#
# Prerequisites: Ollama runs on the host (default port 11434) and has the embedding model,
# see study/setup-ollama.sh.
#
# docs-mcp          scenario d-mcp-server: all guidelines            (port 6281)
# docs-mcp-static   scenario e-mcp-and-specs: general guidelines only (port 6282)
# docs-mcp-target   scenario g-target-mcp-conflict-specs: DB and STD rules only (port 6283)
# docs-mcp-conflict scenario h-conflict-mcp-target-specs: DES rules only (port 6284)
# The servers are separate so that the agent of one scenario cannot see the knowledge of the other.
#
# Usage:
#   docker compose up -d          # start the servers (http://localhost:6281 and :6282)
#   docker compose down           # stop; the index is kept in a volume
#   docker compose down -v        # stop and delete the index
#
# If the embedding model is changed, the guidelines must be indexed again, because vectors
# of different models are not comparable (study/index-knowledge.sh).

name: opencode-multirun

services:
  docs-mcp:
    image: ghcr.io/arabold/docs-mcp-server:latest
    restart: unless-stopped
    # Without these arguments the server uses stdio and exits at once, because the container has no stdin.
    command: ["--protocol", "http", "--host", "0.0.0.0", "--port", "6280"]
    ports:
      # Host port 6281: the default 6280 is often taken by another docs-mcp-server.
      - "${DOCS_MCP_PORT:-6281}:6280"
    # host.docker.internal is the host from inside the container (needed explicitly on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &docs-env
      # Ollama's OpenAI-compatible endpoint; the API key is not checked but must be set.
      OPENAI_API_KEY: ollama
      OPENAI_API_BASE: http://host.docker.internal:${OLLAMA_PORT:-11434}/v1
      DOCS_MCP_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      # Local files may only be indexed from this folder (see volumes).
      DOCS_MCP_SCRAPER_SECURITY_FILE_ACCESS_ALLOWED_ROOTS: /docs
    volumes:
      - docs-mcp-data:/data
      - docs-mcp-config:/config
      # the guidelines of the study; indexed with study/index-knowledge.sh
      - ./sample_guidelines:/docs:ro

  docs-mcp-static:
    image: ghcr.io/arabold/docs-mcp-server:latest
    restart: unless-stopped
    command: ["--protocol", "http", "--host", "0.0.0.0", "--port", "6280"]
    ports:
      - "${DOCS_MCP_STATIC_PORT:-6282}:6280"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *docs-env
    volumes:
      - docs-mcp-static-data:/data
      - docs-mcp-static-config:/config
      # generated by study/build-scenarios.py
      - ./study/scenarios/mcp-static:/docs:ro

  docs-mcp-target:
    image: ghcr.io/arabold/docs-mcp-server:latest
    restart: unless-stopped
    command: ["--protocol", "http", "--host", "0.0.0.0", "--port", "6280"]
    ports:
      - "${DOCS_MCP_TARGET_PORT:-6283}:6280"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *docs-env
    volumes:
      - docs-mcp-target-data:/data
      - docs-mcp-target-config:/config
      # generated by study/build-scenarios.py
      - ./study/scenarios/mcp-target:/docs:ro

  docs-mcp-conflict:
    image: ghcr.io/arabold/docs-mcp-server:latest
    restart: unless-stopped
    command: ["--protocol", "http", "--host", "0.0.0.0", "--port", "6280"]
    ports:
      - "${DOCS_MCP_CONFLICT_PORT:-6284}:6280"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *docs-env
    volumes:
      - docs-mcp-conflict-data:/data
      - docs-mcp-conflict-config:/config
      # generated by study/build-scenarios.py
      - ./study/scenarios/mcp-conflict:/docs:ro

volumes:
  docs-mcp-data:
  docs-mcp-config:
  docs-mcp-static-data:
  docs-mcp-static-config:
  docs-mcp-target-data:
  docs-mcp-target-config:
  docs-mcp-conflict-data:
  docs-mcp-conflict-config:
